<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة لقمة - طلب وتوصيل الطعام الذكي</title>
</head>
<body>

    <!-- شريط العناوين والتنقل العلوي -->
    <nav class="main-nav">
        <div class="nav-container">
            <div class="logo-space">
                <span class="logo-text">لُقمة<span class="dot">.</span></span>
            </div>
            <ul class="nav-menu">
                <li><a href="#home" class="nav-item active">الرئيسية</a></li>
                <li><a href="#categories" class="nav-item">التصنيفات</a></li>
                <li><a href="#meals" class="nav-item">الأطباق الأكثر طلباً</a></li>
                <li><a href="#offers" class="nav-item">العروض الحصرية</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn-cart">السلة <span class="cart-badge">3</span></button>

        </div>

    <!-- الواجهة الرئيسية (Hero Section) -->

        <div class="hero-overlay"></div>
        <div class="hero-inner">
            <span class="badge-promo">🔥 توصيل مجاني للطلب الأول</span>
            <h1>أطباقك المفضلة من <br><span class="highlight">أفضل المطاعم</span> بتكّة زر</h1>
            <p>اكتشف مئات المطاعم القريبة منك، تصفح القوائم، واطلب وجبتك الساخنة لتصلك في أسرع وقت وبأعلى جودة.</p>
            <div class="search-bar-box">
                <input type="text" placeholder="أدخل عنوانك الحالي (مثلاً: الرمال، شارع النصر)...">
                <button class="btn-search">ابحث عن مطعم</button>
            </div>
        </div>
    </header>





</body>
</html>
